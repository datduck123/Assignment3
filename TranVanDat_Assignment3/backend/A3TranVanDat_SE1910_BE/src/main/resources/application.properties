spring.application.name=A3TranVanDat_SE1910
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FUMiniHotelManagement;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA Properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Staff Account configured 
fuhotel.staff.email=staff@fuhotel.com
fuhotel.staff.password=Staff@123456
fuhotel.staff.name=Hotel Administrator

# JWT Configuration
fuhotel.jwt.secret=9a4f2c8d3b7a1e6f4c8b2d1e5a9f3c7b2e6a1f8d4c7b3e9a2f5c8d1e4b7a2e6f
fuhotel.jwt.expiration-ms=86400000

# Swagger OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
